name: build

on:
  push:
    branches:
      - main
      - next
  pull_request:
    branches:
      - main
      - next

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      SWIFT_5_FLAGS: "-Xswiftc -swift-version -Xswiftc 5"

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.0.app

      - name: Cache SwiftPM dependencies
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (debug)
        run: swift build $SWIFT_5_FLAGS

      - name: Test (debug)
        run: swift test $SWIFT_5_FLAGS

      - name: Build (release)
        run: swift build --configuration release $SWIFT_5_FLAGS

      - name: Test (release)
        run: swift test --configuration release $SWIFT_5_FLAGS

  swift6-strict:
    runs-on: macos-15
    timeout-minutes: 30
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.0.app

      - name: Cache SwiftPM dependencies (Swift 6 strict)
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-spm-strict-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build (Swift 6 strict)
        run: swift build

      - name: Test (Swift 6 strict)
        run: swift test
